name: Sync Year Mapping to year_mapping.csv

# ⚠️ ഇവിടെ YOUR_PUBLISHED_CSV_LINK_HERE എന്നത്, "Year Mapping" ടാബ്
# File → Share → Publish to web → CSV ചെയ്ത് കിട്ടുന്ന link വച്ച് replace ചെയ്യുക.

on:
  schedule:
    - cron: '30 18 * * *'   # ദിവസവും ഒരു തവണ (രാത്രി 12:00 AM IST-ന് അടുത്ത്)
  workflow_dispatch: {}      # എപ്പോൾ വേണമെങ്കിലും "Run workflow" വഴി manual trigger ചെയ്യാം

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest Year Mapping CSV from Google Sheet
        run: |
          curl -L -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o year_mapping.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbsDUu6WdIssNTVWre5N99TiMBIfIzjEUnyJluR_6h-KJ06kVK7KrXHoh_0A-UF1g6hoWlBX8ERDCp/pub?gid=1456046618&single=true&output=csv"

          echo "----- ആദ്യത്തെ 3 വരികൾ -----"
          head -n 3 year_mapping.csv

          if ! head -c 50 year_mapping.csv | grep -qi "gri_year"; then
            echo "❌ ഇത് CSV അല്ല (HTML/error page ആയിരിക്കാം). year_mapping.csv overwrite ചെയ്യുന്നില്ല."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add year_mapping.csv
          git diff --staged --quiet || git commit -m "Auto-sync year_mapping.csv from Google Sheet"
          git push
