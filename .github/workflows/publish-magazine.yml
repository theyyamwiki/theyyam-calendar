name: Publish Magazine Issue

on:
  workflow_dispatch:
    inputs:
      ia_id:
        description: 'archive.org-ലെ item ID (ഉദാ: m-2026091615). PDF ആദ്യം archive.org-ൽ upload ചെയ്യുക.'
        required: true
      title:
        description: 'ലക്കത്തിന്റെ പേര് (ഉദാ: ചായില്യം ലക്കം 2)'
        required: true
      date:
        description: 'തീയതി YYYY-MM-DD (ഒഴിവാക്കിയാൽ ഇന്നത്തെ തീയതി ഉപയോഗിക്കും)'
        required: false
      pages:
        description: 'ആകെ പേജ് എണ്ണം (ഒഴിവാക്കിയാൽ archive.org-ൽ നിന്ന് തനിയെ എടുക്കും)'
        required: false
      download_url:
        description: 'PDF ഡൗൺലോഡ് ലിങ്ക് (ഓപ്ഷണൽ). പ്രിന്റ്/A4 PDF വേറെ ഉണ്ടെങ്കിൽ അതിന്റെ https ലിങ്ക് ഇവിടെ കൊടുക്കുക. ഒഴിവാക്കിയാൽ ഈ item-ലെ PDF തന്നെ ഉപയോഗിക്കും.'
        required: false
      draft:
        description: 'yes ആയാൽ ഈ ലക്കം admin preview-ൽ മാത്രമേ കാണൂ (പബ്ലിക് ആയി കാണില്ല). പിന്നീട് ഇതേ ia_id വെച്ച് draft=no ആയി വീണ്ടും റൺ ചെയ്താൽ അത് പബ്ലിക് ആയി മാറും.'
        required: false
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update issues.json from archive.org item
        env:
          IA_ID: ${{ inputs.ia_id }}
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_DATE: ${{ inputs.date }}
          ISSUE_PAGES: ${{ inputs.pages }}
          ISSUE_DOWNLOAD: ${{ inputs.download_url }}
          ISSUE_DRAFT: ${{ inputs.draft }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, datetime, urllib.request, urllib.parse

          ia = os.environ["IA_ID"].strip()
          title = os.environ["ISSUE_TITLE"].strip()
          date = os.environ.get("ISSUE_DATE", "").strip() or datetime.date.today().isoformat()
          is_draft = os.environ.get("ISSUE_DRAFT", "no").strip().lower() == "yes"

          def to_int(v):
              try:
                  return int(str(v).strip())
              except Exception:
                  return 0

          # archive.org-ൽ item ഉണ്ടോ എന്ന് പരിശോധിക്കുന്നു
          url = "https://archive.org/metadata/" + urllib.parse.quote(ia)
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  meta = json.load(r)
          except Exception as e:
              raise SystemExit(f"archive.org-ൽ നിന്ന് വിവരം എടുക്കാൻ കഴിഞ്ഞില്ല: {e}")

          if not meta.get("metadata"):
              raise SystemExit(
                  f"archive.org-ൽ '{ia}' എന്ന item കണ്ടില്ല.\n"
                  f"ID ശരിയാണോ എന്നും upload പൂർത്തിയായോ എന്നും നോക്കുക."
              )

          # item-ൽ 1.jpg, 2.jpg ... ഉണ്ടോ? (പുതിയ രീതി)
          jpg_nums = set()
          for f in meta.get("files", []):
              m = re.fullmatch(r"(\d+)\.jpg", f.get("name", ""), re.I)
              if m and f.get("source") == "original":
                  jpg_nums.add(int(m.group(1)))
          jpg_count = 0
          while (jpg_count + 1) in jpg_nums:
              jpg_count += 1
          if jpg_nums and jpg_count == 0:
              raise SystemExit("JPG ഫയലുകൾ 1.jpg, 2.jpg, 3.jpg ... എന്ന പേരിൽ വേണം (1-ൽ തുടങ്ങണം).")
          fmt = "jpg" if jpg_count else ""

          if fmt == "jpg":
              pages = jpg_count
          else:
              pages = to_int(os.environ.get("ISSUE_PAGES", "")) or to_int(meta["metadata"].get("imagecount"))

          # ഒറിജിനൽ PDF-ന്റെ ഡൗൺലോഡ് ലിങ്ക് (കണ്ടാൽ)
          download = ""
          for f in meta.get("files", []):
              name = f.get("name", "")
              if name.lower().endswith(".pdf") and f.get("source") == "original":
                  download = f"https://archive.org/download/{ia}/{urllib.parse.quote(name)}"
                  break

          override = os.environ.get("ISSUE_DOWNLOAD", "").strip()
          if override:
              if not override.startswith("https://"):
                  raise SystemExit("download_url https:// ൽ തുടങ്ങണം.")
              download = override

          issues_file = "issues.json"
          issues = []
          if os.path.exists(issues_file):
              with open(issues_file, "r", encoding="utf-8") as f:
                  content = f.read().strip()
                  issues = json.loads(content) if content else []

          # ഇതേ ia_id വീണ്ടും റൺ ചെയ്താൽ പഴയ എൻട്രി മാറ്റി പുതിയത് വരും
          issues = [i for i in issues if i.get("ia") != ia]
          entry = {"title": title, "date": date, "ia": ia}
          if pages:
              entry["pages"] = pages
          if fmt:
              entry["fmt"] = fmt
          if download:
              entry["download"] = download
          if is_draft:
              entry["draft"] = True
          issues.append(entry)

          with open(issues_file, "w", encoding="utf-8") as f:
              json.dump(issues, f, ensure_ascii=False, indent=2)

          status = "DRAFT (admin preview only)" if is_draft else "PUBLIC"
          print(f"Added [{status}]: {title} ({date}) ia={ia} fmt={fmt or 'pdf-derived'} pages={pages or 'auto'} download={'yes' if download else 'no'}")
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git add issues.json
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Publish magazine issue: ${{ inputs.title }}"
          git push
