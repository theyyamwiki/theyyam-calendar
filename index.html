    });

    window.triggerAppInstall = function () {
      if (window.deferredInstallPrompt) {
        window.deferredInstallPrompt.prompt();
        window.deferredInstallPrompt.userChoice.finally(function () {
          window.deferredInstallPrompt = null;
        });
      } else {
        var lang = localStorage.getItem('theyyam_lang') || 'en';
        var msg = lang === 'ml'
          ? 'ഈ ആപ്പ് ഇപ്പോൾ install ചെയ്യാൻ കഴിയില്ല. Chrome ബ്രൗസർ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഇത് നേരത്തെ install ചെയ്തതാകാം.'
          : 'This app cannot be installed right now. Try using Chrome, or it may already be installed.';
        alert(msg);
      }
    };

    window.addEventListener('appinstalled', function () {
      window.deferredInstallPrompt = null;
    });
  })();
</script>
</body></html>
