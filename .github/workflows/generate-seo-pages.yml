name: Generate SEO pages

# Runs whenever data.csv changes on main (this covers your existing bot's
# "Auto-sync data.csv from Google Sheet" commits too), and can also be run
# manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "data.csv"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate kavu pages, sitemap.xml, robots.txt
        run: python3 generate_static_pages.py data.csv https://theyyamcalendar.in
      - name: Sync with remote before commit
        # Another workflow (e.g. "Sync Google Sheet to data.csv") can push to
        # main while this job is running. The freshly generated files below
        # are uncommitted, which blocks a plain rebase - so stash them first,
        # rebase onto whatever is now on main, then restore them.
        run: |
          git fetch origin main
          git stash push --include-untracked -m "seo-pages-wip"
          if git rebase origin/main; then
            echo "Rebase succeeded"
          else
            git rebase --abort
            echo "Rebase failed, continuing without it"
          fi
          git stash pop
      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate SEO pages from data.csv"
          file_pattern: >-
            kavu_pages/**
            sitemap.xml
            robots.txt
            kavu_slugs.json
            index.html
