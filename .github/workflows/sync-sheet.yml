name: Sync Google Sheet to data.csv

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest CSV from Google Sheet
        run: |
          curl -L -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o data.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbsDUu6WdIssNTVWre5N99TiMBIfIzjEUnyJluR_6h-KJ06kVK7KrXHoh_0A-UF1g6hoWlBX8ERDCp/pub?gid=1199621547&single=true&output=csv"

          echo "----- ആദ്യത്തെ 3 വരികൾ -----"
          head -n 3 data.csv

          if ! head -c 50 data.csv | grep -qi "kavu_name"; then
            echo "❌ ഇത് CSV അല്ല (HTML/error page ആയിരിക്കാം). data.csv overwrite ചെയ്യുന്നില്ല."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --staged --quiet || git commit -m "Auto-sync data.csv from Google Sheet"
          git push
